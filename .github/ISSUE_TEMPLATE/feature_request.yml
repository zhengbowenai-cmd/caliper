name: Feature request
description: Propose a new probe gate, algorithm, or CLI capability.
title: "[feat] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Probe's scope is deliberately small. New features must either:
        1. Close a **specific known failure mode** (cite a POC finding or paper), or
        2. Replace an existing component with a cheaper / more rigorous algorithm.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What failure mode does this address? Any POC / paper reference?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed algorithm / interface
      description: |
        If you know the algorithm, cite it (paper + specific section).
        If the interface is well-defined, sketch the function signature.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What did you rule out, and why?
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: The proposal does NOT require a new LLM API family (Probe stays provider-agnostic)
        - label: The proposal comes with a citable reference OR an empirical justification
        - label: I have read `docs/architecture.md` and placed this feature in the correct layer
