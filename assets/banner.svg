<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Caliper">
  <defs>
    <style>
      .word  { font-family: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 800; letter-spacing: -0.035em; }
      .tag   { font-family: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-weight: 500; }
      .cn    { font-family: 'PingFang SC', 'Noto Serif SC', 'Microsoft YaHei', serif; font-weight: 400; letter-spacing: 0.06em; }
      .mono  { font-family: 'JetBrains Mono', ui-monospace, 'Menlo', 'Consolas', monospace; font-weight: 500; letter-spacing: 0.18em; }
    </style>

    <!-- Extremely subtle graph-paper pattern -->
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#D8CFB8" stroke-width="0.5" opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Warm cream background -->
  <rect width="1200" height="320" fill="#F7F1E3"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- Top-left instrument signature -->
  <text x="60" y="46" class="mono" font-size="11" fill="#8A857B">± 0.001</text>

  <!-- Top-right corner coordinate markers (like a technical drawing frame) -->
  <g stroke="#B5A889" stroke-width="0.8" fill="none" opacity="0.55">
    <line x1="40"   y1="40"   x2="40"   y2="52"/>
    <line x1="40"   y1="40"   x2="52"   y2="40"/>
    <line x1="1160" y1="40"   x2="1160" y2="52"/>
    <line x1="1160" y1="40"   x2="1148" y2="40"/>
    <line x1="40"   y1="280"  x2="40"   y2="268"/>
    <line x1="40"   y1="280"  x2="52"   y2="280"/>
    <line x1="1160" y1="280"  x2="1160" y2="268"/>
    <line x1="1160" y1="280"  x2="1148" y2="280"/>
  </g>

  <!-- Main wordmark -->
  <text x="60" y="188" class="word" font-size="132" fill="#1A1A1A">Caliper</text>

  <!-- Accent rule below wordmark (suggests a measured interval) -->
  <g>
    <rect x="62" y="204" width="112" height="3" fill="#A84E2E"/>
    <!-- tiny tick at each end -->
    <rect x="62"  y="200" width="1.5" height="11" fill="#A84E2E"/>
    <rect x="172" y="200" width="1.5" height="11" fill="#A84E2E"/>
  </g>

  <!-- English tagline -->
  <text x="60" y="244" class="tag" font-size="19" fill="#3D3A35">
    Algorithmically-guaranteed skill self-iteration for Claude Code.
  </text>

  <!-- Chinese tagline -->
  <text x="60" y="273" class="cn" font-size="16" fill="#7A7469">
    每一个环节都带数学保证。
  </text>

  <!-- Right-side quiet readout -->
  <g transform="translate(1140, 188)" text-anchor="end">
    <text class="mono" font-size="13" fill="#A84E2E" letter-spacing="0.08em">[ +0.095 ± 0.040 ]</text>
    <text y="22" class="mono" font-size="10" fill="#8A857B">paired · bca95 · n=40</text>
  </g>

  <!-- Bottom-right instrument signature -->
  <text x="1140" y="292" class="mono" font-size="11" fill="#8A857B" text-anchor="end">
    v0.1.0 · mit · 46 tests
  </text>
</svg>
