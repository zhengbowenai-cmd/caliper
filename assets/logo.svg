<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Caliper logo">
  <defs>
    <style>
      .C    { font-family: 'Inter', ui-sans-serif, -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 800; letter-spacing: -0.04em; }
      .mono { font-family: 'JetBrains Mono', ui-monospace, 'Menlo', monospace; font-weight: 500; letter-spacing: 0.2em; }
    </style>
  </defs>

  <!-- Rounded-square background -->
  <rect width="512" height="512" rx="110" ry="110" fill="#F7F1E3"/>

  <!-- Instrument-frame corner marks -->
  <g stroke="#B5A889" stroke-width="2" fill="none" opacity="0.6">
    <path d="M 62 62  L 62 84  M 62 62  L 84 62"/>
    <path d="M 450 62  L 450 84  M 450 62  L 428 62"/>
    <path d="M 62 450  L 62 428  M 62 450  L 84 450"/>
    <path d="M 450 450  L 450 428  M 450 450  L 428 450"/>
  </g>

  <!-- Top micro-label -->
  <text x="256" y="120" text-anchor="middle" class="mono" font-size="20" fill="#8A857B">± 0.001</text>

  <!-- Giant "C" with a tiny interval tick inside — wordmark mark -->
  <text x="256" y="330" text-anchor="middle" class="C" font-size="280" fill="#1A1A1A">C</text>

  <!-- Accent interval under the C -->
  <g>
    <rect x="176" y="360" width="160" height="4" fill="#A84E2E"/>
    <rect x="176" y="355" width="2" height="14" fill="#A84E2E"/>
    <rect x="334" y="355" width="2" height="14" fill="#A84E2E"/>
  </g>

  <!-- Bottom wordmark -->
  <text x="256" y="420" text-anchor="middle" class="C" font-size="50" fill="#1A1A1A">Caliper</text>
</svg>
