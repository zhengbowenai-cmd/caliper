[project]
name = "caliper"
version = "0.1.0"
description = "让 prompt 从\"感觉好了\"变成\"真好了\" · Where \"feels better\" becomes \"measurably better\" for your AI prompts."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Caliper contributors" }]
keywords = [
    "claude-code",
    "agent-skills",
    "skill-iteration",
    "prompt-optimization",
    "llm-evaluation",
    "confidence-sequences",
    "bootstrap",
    "shapley",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.3.3",
    "krippendorff>=0.8.2",
    "numpy>=2.4.4",
    "openai>=2.32.0",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "scipy>=1.17.1",
]

[project.urls]
Homepage = "https://github.com/zhengbowenai-cmd/caliper"
Documentation = "https://github.com/zhengbowenai-cmd/caliper#readme"
Issues = "https://github.com/zhengbowenai-cmd/caliper/issues"
Changelog = "https://github.com/zhengbowenai-cmd/caliper/blob/main/CHANGELOG.md"

[project.scripts]
caliper = "caliper.cli:cli"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.0",
    "pyright>=1.1.400",
    "pre-commit>=4.0.0",
]

# --------------------------------------------------------------------
# Tool: Ruff — linter + formatter (Google / Anthropic style)
# --------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = [".venv", "runs", "examples/**/variants"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "C4",   # comprehensions
    "SIM",  # simplify
    "PL",   # pylint subset
    "RUF",  # ruff-specific
    "N",    # naming (pep8-naming)
    "ANN",  # function annotations
    "TRY",  # tryceratops
    "PTH",  # prefer pathlib
]
ignore = [
    "E501",     # handled by formatter
    "PLR0913",  # too many arguments (Optimizer has a lot by design)
    "PLR2004",  # magic values (we have thresholds everywhere)
    "ANN401",   # Any is fine for some adapters
    "TRY003",   # long exception messages OK
    "N806",     # allow UPPER_CASE local vars for stats notation
    "N803",     # same, allow X, Y in numeric code
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "N", "PTH"]
"examples/**" = ["ANN", "PLR2004", "T20", "PTH"]

[tool.ruff.lint.isort]
known-first-party = ["caliper"]
combine-as-imports = true

# --------------------------------------------------------------------
# Tool: Pyright — type checker
# --------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv", "runs"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportPrivateUsage = false

# --------------------------------------------------------------------
# Tool: Pytest
# --------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning:pydantic.*",
    "ignore::RuntimeWarning:scipy.*",
    "ignore:invalid value encountered:RuntimeWarning",
    "ignore:The BCa confidence interval cannot be calculated:UserWarning",
]

[tool.coverage.run]
source = ["caliper"]
branch = true
omit = ["tests/*", "examples/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
show_missing = true
skip_covered = false
